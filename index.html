<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carregando...</title>
  <script>
    // =========================
    // CONTROLE DE VERSÃO (altere a cada deploy)
    // =========================
    const APP_VERSION = 'v2.0.2'; // ← incremente a cada deploy
  </script>
</head>
<body>
  <h1 style="text-align:center; margin-top:40vh; font-family:sans-serif;">Atualizando o sistema...</h1>
  <script>
    (function() {
      const versaoSalva = localStorage.getItem('app_version');

      // Se a versão já está correta, apenas redireciona (com cache-busting)
      if (versaoSalva === APP_VERSION) {
        window.location.replace('./app.html?_=' + Date.now());
        return;
      }

      console.log('🧹 Limpando caches antigos...');

      // 1. Remove todos os service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(reg => reg.unregister());
        });
      }

      // 2. Remove todos os caches
      if ('caches' in window) {
        caches.keys().then(names => {
          names.forEach(name => caches.delete(name));
        });
      }

      // 3. Atualiza a versão salva
      localStorage.setItem('app_version', APP_VERSION);

      // 4. Pequeno delay e redireciona para o app real (com cache-busting)
      setTimeout(() => {
        window.location.replace('./app.html?_=' + Date.now());
      }, 1000);
    })();
  </script>
</body>
</html>
